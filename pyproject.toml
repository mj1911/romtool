[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "romtool"
version = "0.1.0"
description = "Interleave and de-interleave binary ROM/EEPROM images"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mj1911", email = "rhlabs@proton.me" }]

[project.urls]
Repository = "https://github.com/mj1911/romtool"

[project.scripts]
romtool = "romtool.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
